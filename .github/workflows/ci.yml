name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(github.event.head_commit.message, '[bridge-diagnostic]') && '[{"os":"windows-2025","node":22,"platform":"win32"},{"os":"macos-15","node":24,"platform":"darwin"}]' || '[{"os":"ubuntu-24.04","node":22,"platform":"linux"},{"os":"windows-2025","node":22,"platform":"win32"},{"os":"macos-15","node":24,"platform":"darwin"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BRIDGE_CI_EVIDENCE: ${{ github.workspace }}/../bridge-audit-evidence
      BRIDGE_TEST_EVIDENCE: ${{ github.workspace }}/../bridge-audit-evidence/fixtures
      BRIDGE_INTEGRATION_EVIDENCE: ${{ github.workspace }}/../bridge-audit-evidence/commit-signals
      BRIDGE_CI_UPLOAD: ${{ github.workspace }}/../bridge-audit-upload
      BRIDGE_EXPECTED_PLATFORM: ${{ matrix.platform }}
      BRIDGE_EXPECTED_NODE: ${{ matrix.node }}
      BRIDGE_CI_DIAGNOSTIC: ${{ contains(github.event.head_commit.message, '[bridge-diagnostic]') && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record platform and isolate Git configuration
        run: node scripts/integration/ci-environment.mjs
      - name: Install dependencies from unchanged lockfile
        id: install
        run: node scripts/integration/record-check.mjs install node "$BRIDGE_NPM_CLI" ci --no-audit --no-fund
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/integration/record-check.mjs typecheck node "$BRIDGE_NPM_CLI" run typecheck
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/integration/record-check.mjs build node "$BRIDGE_NPM_CLI" run build
      - name: Run the complete suite at default concurrency
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.BRIDGE_CI_DIAGNOSTIC != '1' }}
        run: node scripts/integration/record-check.mjs full node --test 'dist/tests/unit/**/*.test.js'
      - name: Compare the complete raw MCP schema and input contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.BRIDGE_CI_DIAGNOSTIC != '1' }}
        run: node scripts/integration/record-check.mjs schema node --test dist/tests/unit/mcp-stdio.test.js
      - name: Verify real tgz installation, native bin wrapper, and full MCP contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' && env.BRIDGE_CI_DIAGNOSTIC != '1' }}
        run: node scripts/integration/record-check.mjs pack node "$BRIDGE_NPM_CLI" run verify:package -- "$BRIDGE_CI_EVIDENCE"
      - name: Verify native Git transactions and platform lifecycle boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.BRIDGE_CI_DIAGNOSTIC != '1' }}
        run: node scripts/integration/record-check.mjs integration node --test --test-concurrency=1 scripts/integration/git-transaction.test.mjs scripts/integration/commit-shutdown.test.mjs scripts/integration/windows-lifecycle.test.mjs
      - name: Diagnose macOS readiness failure once per failed mixed case
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.BRIDGE_CI_DIAGNOSTIC == '1' && matrix.platform == 'darwin' }}
        run: node scripts/integration/record-check.mjs diagnostic node --import ./scripts/integration/ci-diagnostic-preload.mjs --test --test-name-pattern='drains alongside' scripts/integration/commit-shutdown.test.mjs
      - name: Diagnose Windows descendant exit and teardown once per failed case
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.BRIDGE_CI_DIAGNOSTIC == '1' && matrix.platform == 'win32' }}
        run: node scripts/integration/record-check.mjs diagnostic node --import ./scripts/integration/ci-diagnostic-preload.mjs --test --test-name-pattern='cannot report PASS' scripts/integration/windows-lifecycle.test.mjs
      - name: Check synthetic artifacts before upload
        id: artifacts
        if: ${{ always() }}
        run: node scripts/integration/prepare-artifacts.mjs
      - name: Preserve every run, including failing gates
        if: ${{ always() && steps.artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ steps.artifacts.outputs.upload_path }}
          retention-days: 14
          if-no-files-found: error
